<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroExchange | Price Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo"><a href="index.html">RetroExchange</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li> 
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="sell.html">Sell/Trade</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="utility.html">Utility</a></li>
                    <li id="nav-login"><a href="login.html">Login</a></li>
                    <li id="nav-dashboard" style="display:none;"><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Retro Price Estimator</h2>
        <p>Not sure what your game is worth? Use our estimator.</p>
        <br>
        <div class="utility-box">
            <div class="form-group" style="text-align: left; max-width: 400px; margin: 0 auto;">
                <label>Console Generation</label>
                <select id="util-gen">
                    <option value="10">8-Bit (NES/Master System)</option>
                    <option value="20">16-Bit (SNES/Genesis)</option>
                    <option value="30">3D Era (N64/PS1)</option>
                </select>
                <br><br>
                <label>Condition</label>
                <select id="util-cond">
                    <option value="2">Mint In Box</option>
                    <option value="1.5">Loose (Good)</option>
                    <option value="0.8">Loose (Poor)</option>
                </select>
            </div>
            <br>
            <button class="btn btn-secondary" onclick="app.calculateValue()">Estimate Value</button>
            <div id="util-result" class="result-display">$0.00</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 RetroExchange. All rights reserved.</p>
        <p><a href="about.html">About</a> | <a href="credits.html">Credits</a> | <a href="config.html">Admin</a></p>
    </footer>
</body>
</html>

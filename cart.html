<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroExchange | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</head>
<body id="page-cart">

    <header>
        <div class="header-container">
            <div class="logo"><a href="index.html">RetroExchange</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html" class="active">Cart</a></li>
                    <li id="nav-login"><a href="login.html">Login</a></li>
                    <li id="nav-dashboard" style="display:none;"><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Your Loot Stash</h2>

        <div class="form-container" style="max-width: 800px;">
            <div id="cart-content">
                </div>

            <div id="cart-summary" style="margin-top: 30px; border-top: 2px solid #555; padding-top: 20px; text-align: right;">
                <h3 style="color: var(--neon-pink);">Total: $<span id="cart-total">0.00</span></h3>
                <br>
                <button class="btn btn-primary" onclick="app.checkout()">Checkout</button>
                <button class="btn" style="background: #444; color: white;" onclick="app.clearCart()">Clear Cart</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 RetroExchange. All rights reserved.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroExchange | Sell</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</head>
<body id="page-sell">
    <header>
        <div class="header-container">
            <div class="logo"><a href="index.html">RetroExchange</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li> 
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="sell.html">Sell/Trade</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="utility.html">Utility</a></li>
                    <li id="nav-login"><a href="login.html">Login</a></li>
                    <li id="nav-dashboard" style="display:none;"><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>List Item for Sale</h2>
        <div class="form-container">
            <form id="sell-form">
                <div class="form-group">
                    <label>Game Title *</label>
                    <input type="text" id="sell-title" required>
                </div>
                
                <div class="form-group">
                    <label>Console *</label>
                    <select id="sell-console">
                        <option value="NES">NES</option>
                        <option value="SNES">SNES</option>
                        <option value="Genesis">Sega Genesis</option>
                        <option value="N64">N64</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price ($) *</label>
                    <input type="number" id="sell-price" min="1" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit Listing</button>
                <div id="sell-msg" style="margin-top: 10px;"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 RetroExchange. All rights reserved.</p>
        <p><a href="about.html">About</a> | <a href="config.html">Admin</a></p>
    </footer>
</body>
</html>
